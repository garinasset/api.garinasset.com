<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <title>嘉林数据 API 目录</title>

    <style>
        html {
            font-size: 1em;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #333;

            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 页面整体布局 */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3em;
            padding: 3em 1em;
            flex: 1;
        }

        /* logo行 */
        .logo-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 2em;
        }

        /* svg尺寸 */
        .logo-row svg {
            width: 3em;
            height: 3em;
        }

        /* 卡片容器 */
        .card-container {
            display: flex-column;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2em;
            flex: 1;
            align-content: flex-start;
        }

        /* 卡片 */
        .card {
            /* border: 0.1em solid #ccc; */
            padding: 1.5em;
            border-radius: 0.5em;
            text-align: center;
            font-size: 0.8em;
        }

        /* 卡片标题 */
        .card-title {
            font-weight: 400;
            color: rgb(0, 0, 153);
            margin-bottom: 0.3em;

        }

        /* API地址 */
        .card-link {
            font-weight: 700;
            color: rgb(0, 0, 153);
        }

        .card-link a {
            text-decoration: none;
            color: rgb(0, 0, 153);
            text-decoration-line: underline;
            text-decoration-style: dashed;
            text-decoration-color: rgba(0, 0, 153, 0.45);
            text-underline-offset: 0.25em;
        }

        .card a:hover {
            text-decoration-style: solid;
        }

        /* 页脚 */
        .footer {
            font-size: 0.8em;
            color: #777;
        }
    </style>
</head>
